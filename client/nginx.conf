# Preserve the edge's X-Forwarded-Proto: Railway terminates TLS and sets it to
# https, then nginx sees plain http from the edge. Passing our own $scheme here
# would overwrite https with http and make Express think the connection is
# insecure — dropping your `secure` cookies. Fall back to $scheme only when
# hit directly with no incoming XFP (e.g. local).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;

  # API → backend over the private network. NO trailing slash on the upstream:
  # that keeps the /api prefix intact, matching the backend's /api/v2/* mount.
  location /api/ {
    proxy_pass ${API_UPSTREAM};

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # SPA. Fall back to index.html so React Router deep links resolve on refresh
  # instead of 404ing.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}