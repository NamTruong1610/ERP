# Local dev: Postgres + Redis + API in containers.
# Run the Vite frontend on the host (npm run dev) — CORS is already pinned to
# http://localhost:5173, so no code change needed.
#
# Put R2 / Resend / clinic secrets in a .env file next to this (see keys in
# validateEnv.js). DATABASE_URL and REDIS_URL are set explicitly below so they
# point at the compose service names and override anything in .env.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dentacore
      POSTGRES_PASSWORD: dentacore
      POSTGRES_DB: dentacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentacore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dentacore:dentacore@postgres:5432/dentacore
      REDIS_URL: redis://redis:6379
      PORT: 5500
    ports:
      - "5500:5500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
